name: github-org-actions
services:
  github-org-actions:
    image: ghcr.io/sekai-soft/github-org-actions:latest
    container_name: github-org-actions
    restart: unless-stopped
    env_file:
      - env
    depends_on:
      github-org-actions-ts:
        condition: service_healthy
    network_mode: service:github-org-actions-ts
  github-org-actions-ts:
    image: tailscale/tailscale:latest
    container_name: github-org-actions-ts
    restart: unless-stopped
    hostname: github-org-actions
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - github-org-actions-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  github-org-actions-ts:
